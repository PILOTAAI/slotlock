# Bundles the dashboard Worker (workers/dashboard) and the admin console Worker (workers/admin) to
# check they build, on pull requests too. It never deploys and holds no Cloudflare credentials. A
# Workers deploy token can replace a Worker and so read its session secret, which signs in as any
# tenant (or, for the console, as staff), so no pull_request job may hold one: Slotlock Cloud's
# dashboard deploys from dashboard-deploy.yml, once CI passes on main, with a token on the
# `dashboard` environment that only main can use. Anyone else deploys from their own pipeline, with
# their own wrangler configuration and token (docs: "Dashboard on Cloudflare Workers").
#
# Every action is pinned to the commit SHA site.yml uses (resolved on 2026-10-09). Wrangler is
# pinned exactly in workers/dashboard/package-lock.json and workers/admin/package-lock.json.
name: Dashboard

on:
  pull_request:
    paths:
      - "workers/dashboard/**"
      - "workers/admin/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard.yml"
  push:
    branches: [main]
    paths:
      - "workers/dashboard/**"
      - "workers/admin/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # wrangler 4.149.0 needs >= 22.0.0
      # The Worker bundles Slotlock's own sources and its runtime dependencies.
      - name: Install Slotlock's dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Wrangler from the lockfile
        working-directory: workers/dashboard
        run: npm ci --no-audit --no-fund
      - name: Bundle the Worker
        working-directory: workers/dashboard
        run: npm run check
      - name: Install Wrangler for the admin console from the lockfile
        working-directory: workers/admin
        run: npm ci --no-audit --no-fund
      - name: Bundle the admin console Worker
        working-directory: workers/admin
        run: npm run check
