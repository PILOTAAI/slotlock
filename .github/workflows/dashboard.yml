# Bundles the dashboard Worker (workers/dashboard) and deploys it to app.slotlock.pylota.io.
#
# Pull requests bundle it only (wrangler deploy --dry-run). A push to main, or a manual run on main,
# also deploys, once workers/dashboard/wrangler.jsonc names the Hyperdrive configuration. The
# secrets (GitHub client ID and secret, session secret) live on the Worker itself, set once with
# `wrangler secret put`, and are never in this workflow.
#
# Every action is pinned to the commit SHA site.yml uses (resolved on 2026-10-09). Wrangler is
# pinned exactly in workers/dashboard/package-lock.json.
#
# Secrets, on the `dashboard` environment:
#   CLOUDFLARE_API_TOKEN   Account: Workers Scripts: Edit, Hyperdrive: Read; Zone (pylota.io only):
#                          Workers Routes: Edit, DNS: Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that holds the pylota.io zone
name: Dashboard

on:
  pull_request:
    paths:
      - "workers/dashboard/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard.yml"
      - "scripts/check-cloudflare-credentials.sh"
  push:
    branches: [main]
    paths:
      - "workers/dashboard/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dashboard.yml"
      - "scripts/check-cloudflare-credentials.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # wrangler 4.149.0 needs >= 22.0.0
      # The Worker bundles Slotlock's own sources and its runtime dependencies.
      - name: Install Slotlock's dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Wrangler from the lockfile
        working-directory: workers/dashboard
        run: npm ci --no-audit --no-fund
      - name: Bundle the Worker
        working-directory: workers/dashboard
        run: npm run check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: dashboard
      url: https://app.slotlock.pylota.io/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Slotlock's dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Wrangler from the lockfile
        working-directory: workers/dashboard
        run: npm ci --no-audit --no-fund
      # Until the infrastructure has created the Hyperdrive configuration and its id is committed,
      # a deploy would bind nothing: stop with the reason instead.
      - name: Check the Hyperdrive configuration is named
        run: |
          if grep -q 'set-this-to-the-hyperdrive-configuration-id' workers/dashboard/wrangler.jsonc; then
            echo "::error title=Hyperdrive::workers/dashboard/wrangler.jsonc does not name the Hyperdrive configuration yet (README: Dashboard on Cloudflare Workers)"
            exit 1
          fi
      - name: Check the Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/check-cloudflare-credentials.sh
      - name: Deploy to Cloudflare Workers
        working-directory: workers/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
