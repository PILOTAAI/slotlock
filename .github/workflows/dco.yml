# Developer Certificate of Origin: fail a pull request when any of its commits lacks a
# `Signed-off-by:` line for its author (git commit --signoff). See scripts/check-dco.sh.
name: DCO

on:
  pull_request:
  # release-version.yml starts it on a release branch: its GITHUB_TOKEN pull request starts nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The SHAs travel through the environment, never spliced into the script. A manual run has no
      # pull request: it checks the branch's commits since it left main.
      - run: |
          base=${BASE_SHA:-$(git merge-base origin/main HEAD)}
          head=${HEAD_SHA:-$(git rev-parse HEAD)}
          scripts/check-dco.sh "$base" "$head"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
