# Tag release: merging a version to main releases it. On every push to main, scripts/plan-release.sh
# decides whether package.json's version is a release: not tagged yet, with a dated CHANGELOG
# heading, and passing every check scripts/check-release-tag.sh makes. If it is, this job creates the
# annotated v<version> tag on that commit and starts release.yml (npm) and image.yml (the image, then
# the MCP Registry) on the tag.
#
# A tag pushed with GITHUB_TOKEN starts no workflow, so both are started with workflow_dispatch,
# which a GITHUB_TOKEN may start, on the tag's ref: they run exactly as for a pushed tag, with
# GITHUB_REF_NAME set to it. A maintainer can still push a tag by hand instead (an admin may create
# any v* tag), which starts both through their own push trigger; this job then sees the tag exists
# and does nothing.
#
# One-time setup: scripts/configure-github.sh lets this workflow create v* tags (the "Release tags"
# ruleset protects them from being moved or deleted).
name: Tag release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag and start the release
    # A manual run on any other ref tags nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Push the v<version> tag.
      contents: write
      # Start release.yml and image.yml on the tag (workflow_dispatch).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept for the one `git push` of the tag below. The only other code this job runs is
          # this repository's own scripts, from the main commit it is tagging.
          persist-credentials: true
      - name: Decide whether this commit is a release
        id: plan
        run: scripts/plan-release.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Create the tag
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "Slotlock ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Start Release and Image on the tag
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          {
            echo "### Released $TAG"
            echo "Created the tag on $GITHUB_SHA and started Release (npm) and Image (GHCR, then the MCP Registry) on it."
          } >> "$GITHUB_STEP_SUMMARY"
