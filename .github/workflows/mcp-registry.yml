# MCP Registry: publish server.json to registry.modelcontextprotocol.io as
# io.github.PILOTAAI/slotlock. image.yml calls this workflow once its image job has pushed and
# attested the release image, so it runs for the same v* tag. mcp-publisher authenticates with
# this job's GitHub OIDC token; no secret is stored.
#
# The registry pulls the image anonymously and compares its io.modelcontextprotocol.server.name
# label with the server name, case-sensitively, and the io.github.<owner> part must equal the
# token's repository_owner claim exactly (PILOTAAI). A version can be published once only. If
# this job fails because the image is still private, make the package public and re-run it.
#
# One-time setup by the repository owner:
#   - A GitHub environment named `mcp-registry`, with deployment tags limited to v*.
#   - The ghcr.io/pilotaai/slotlock package made public (see image.yml).
name: MCP Registry

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mcp-registry
    permissions:
      contents: read
      # mcp-publisher login github-oidc exchanges this job's OIDC token for a registry token.
      id-token: write
    env:
      # https://github.com/modelcontextprotocol/registry/releases/tag/v1.8.1; the checksum is the
      # release's registry_1.8.1_checksums.txt entry. OIDC audience binding needs v1.7.6 or later.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against main, package.json, CHANGELOG.md and server.json
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: Check the image is public and carries the server name
        run: |
          name=$(jq -r .name server.json)
          image=$(jq -r '.packages[0].identifier' server.json)
          # Anonymous, as the registry pulls it; the registry reads the linux/amd64 variant.
          if ! labels=$(docker buildx imagetools inspect "$image" \
            --format '{{ json (index .Image "linux/amd64").Config.Labels }}'); then
            echo "::error::$image cannot be pulled anonymously. Make the GHCR package public, then re-run this job."
            exit 1
          fi
          label=$(jq -r '."io.modelcontextprotocol.server.name"' <<< "$labels")
          if [ "$label" != "$name" ]; then
            echo "::error::$image is labelled '$label', but server.json names '$name'."
            exit 1
          fi
      - name: Install mcp-publisher ${{ env.MCP_PUBLISHER_VERSION }}
        run: |
          curl --fail --silent --show-error --location --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
