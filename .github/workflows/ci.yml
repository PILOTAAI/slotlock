# CI: the full suite (vitest, build, packed-artifact verification) against PostgreSQL 16 on the
# Node.js versions the README supports; the database suites again on PostgreSQL 17 (the major the
# hosted service runs) and on the PostgreSQL 18 image docker-compose.yml pulls; a smoke test of the
# server image; the language clients against it; and the Docker Compose quickstart, end to end.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: slotlock_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slotlock_ci --dbname=slotlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://slotlock_ci:ci-only-password@localhost:5432/slotlock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  postgres:
    name: Database suites (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '17'
            postgres-image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
          # The image docker-compose.yml pulls, digest and all.
          - postgres: '18'
            postgres-image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_USER: slotlock_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slotlock_ci --dbname=slotlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://slotlock_ci:ci-only-password@localhost:5432/slotlock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Every *.integration.test.ts file; vitest runs them one file at a time (vitest.config.ts).
      - run: npx vitest run .integration.test.ts

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: slotlock_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slotlock_ci --dbname=slotlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: slotlock:ci
      - name: Refuses to start without configuration
        run: |
          docker run --rm slotlock:ci --version
          status=0
          docker run --rm slotlock:ci serve || status=$?
          if [ "$status" -ne 2 ]; then
            echo "::error::serve without configuration exited $status, expected 2"
            exit 1
          fi
      # slotlock_ci is the service's superuser, which row-level security does not confine.
      - name: Refuses to serve as a superuser
        run: |
          status=0
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://slotlock_ci:ci-only-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_AUTH_TOKEN="$(openssl rand -hex 32)" \
            --env SLOTLOCK_CONFIRMATION_SECRET="$(openssl rand -hex 32)" \
            --env HOST=127.0.0.1 \
            slotlock:ci serve 2> refusal.log || status=$?
          cat refusal.log
          if [ "$status" -ne 1 ] || ! grep -q '"code":"unsafe_serving_role"' refusal.log; then
            echo "::error::serve as a superuser exited $status, expected 1 with unsafe_serving_role"
            exit 1
          fi
      # As in docker-compose.yml: the server runs as a role without SUPERUSER or BYPASSRLS, and
      # migrate, as the owner, grants it what it needs.
      - name: Creates the serving role
        run: |
          docker run --rm --network host --env PGPASSWORD=ci-only-password \
            postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d \
            psql --host=127.0.0.1 --username=slotlock_ci --dbname=slotlock --no-psqlrc \
              -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE slotlock_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
      - name: Migrates, serves and reports healthy
        run: |
          docker run --detach --name slotlock --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --env DATABASE_URL=postgresql://slotlock_app:ci-app-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_MIGRATE_DATABASE_URL=postgresql://slotlock_ci:ci-only-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_AUTH_TOKEN="$(openssl rand -hex 32)" \
            --env SLOTLOCK_CONFIRMATION_SECRET="$(openssl rand -hex 32)" \
            --env HOST=127.0.0.1 \
            slotlock:ci serve --migrate
          health=starting
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' slotlock)
            [ "$health" = healthy ] && break
            sleep 2
          done
          docker logs slotlock
          if [ "$health" != healthy ]; then
            echo "::error::the container is $health, not healthy"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          docker stop slotlock
          [ "$(docker inspect --format '{{.State.ExitCode}}' slotlock)" = 0 ]

  clients:
    name: Language clients against the image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: slotlock_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slotlock_ci --dbname=slotlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: slotlock:ci
      # The server the clients call: the image, as a role row-level security confines, confirming
      # only deletes (so the suites write events and still meet a 428), with an admin key. The smoke
      # check and all five suites write as one key of one tenant, faster than its hosted budgets (20
      # writes, then 5 a second, for the key, the tenant and the tenant's application API), so those
      # buckets are off here; the clients' 429 handling is unit-tested and the limits themselves by
      # hosted-limits.integration.test.ts.
      - name: Serves the image with an admin key
        run: |
          docker run --rm --network host --env PGPASSWORD=ci-only-password \
            postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d \
            psql --host=127.0.0.1 --username=slotlock_ci --dbname=slotlock --no-psqlrc \
              -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE slotlock_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
          docker run --detach --name slotlock --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --env DATABASE_URL=postgresql://slotlock_app:ci-app-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_MIGRATE_DATABASE_URL=postgresql://slotlock_ci:ci-only-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_CONFIRMATION_SECRET="$(openssl rand -hex 32)" \
            --env SLOTLOCK_CONFIRM_WRITES=slotlock_delete_event \
            --env SLOTLOCK_TENANT=clients \
            --env SLOTLOCK_LIMITS=key_read=off,key_write=off,tenant_read=off,tenant_write=off,app_read=off,app_write=off \
            --env HOST=127.0.0.1 \
            slotlock:ci serve --migrate
          health=starting
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' slotlock)
            [ "$health" = healthy ] && break
            sleep 2
          done
          if [ "$health" != healthy ]; then
            docker logs slotlock
            echo "::error::the container is $health, not healthy"
            exit 1
          fi
          key=$(docker exec slotlock slotlock key create "Client suites" --scope read,write,admin | jq -r .key)
          # Without the key every server test would skip and the job would pass having called nothing.
          if [[ ! "$key" =~ ^slk_[0-9A-Za-z]{46}$ ]]; then
            echo "::error::key create printed no key"
            exit 1
          fi
          echo "::add-mask::$key"
          {
            echo "SLOTLOCK_URL=http://localhost:8080"
            echo "SLOTLOCK_ADMIN_KEY=$key"
          } >> "$GITHUB_ENV"

      # The check an operator runs after a deployment (scripts/smoke-deployment.mjs), run against
      # the image here so it stays true to the server.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Deployment smoke check
        run: node scripts/smoke-deployment.mjs

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Python
        working-directory: clients/python
        run: PYTHONPATH=src python -m unittest -v tests/test_client.py

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache: false
      - name: Go
        working-directory: clients/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 -v ./...

      - name: Rust
        working-directory: clients/rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          cargo +1.94.0 fmt --check
          cargo +1.94.0 clippy --all-targets --locked -- -D warnings
          cargo +1.94.0 test --locked

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.5.1'
      - name: Java
        working-directory: clients/java
        run: gradle build --console=plain

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: .NET
        working-directory: clients/dotnet
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet build src/Slotlock --configuration Release
          dotnet run --project tests/Slotlock.Tests --configuration Release

      - name: Server log
        if: failure()
        run: docker logs slotlock

  compose:
    name: Compose quickstart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The README's quickstart: .env from .env.example with its secrets filled in, then
      # docker compose up --build, the deployment smoke check, and a restart on the same volume.
      - name: Write .env from .env.example
        run: scripts/quickstart-env.sh > .env
      - name: Run the quickstart and check it
        run: scripts/compose-smoke.sh

  # The one check the "Protect main" ruleset requires from this workflow (scripts/configure-github.sh,
  # with DCO's Signed-off-by): it passes only when every job above passed, so the client suites, the
  # database suites on each PostgreSQL and the quickstart gate merges, and a job added here is
  # required without touching the ruleset. Its needs list every other job (release-infrastructure
  # test).
  passed:
    name: CI passed
    # A required check that is skipped counts as passing, so this runs whatever the jobs did.
    if: always()
    needs: [test, postgres, image, clients, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<<"$RESULTS" >/dev/null
