# CI: the full suite (vitest, build, packed-artifact verification) against PostgreSQL 16 on the
# Node.js versions the README supports, and a smoke test of the server image.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: slotlock_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slotlock_ci --dbname=slotlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://slotlock_ci:ci-only-password@localhost:5432/slotlock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: slotlock_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slotlock_ci --dbname=slotlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: slotlock:ci
      - name: Refuses to start without configuration
        run: |
          docker run --rm slotlock:ci --version
          status=0
          docker run --rm slotlock:ci serve || status=$?
          if [ "$status" -ne 2 ]; then
            echo "::error::serve without configuration exited $status, expected 2"
            exit 1
          fi
      # slotlock_ci is the service's superuser, which row-level security does not confine.
      - name: Refuses to serve as a superuser
        run: |
          status=0
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://slotlock_ci:ci-only-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_AUTH_TOKEN="$(openssl rand -hex 32)" \
            --env SLOTLOCK_CONFIRMATION_SECRET="$(openssl rand -hex 32)" \
            --env HOST=127.0.0.1 \
            slotlock:ci serve 2> refusal.log || status=$?
          cat refusal.log
          if [ "$status" -ne 1 ] || ! grep -q '"code":"unsafe_serving_role"' refusal.log; then
            echo "::error::serve as a superuser exited $status, expected 1 with unsafe_serving_role"
            exit 1
          fi
      # As in docker-compose.yml: the server runs as a role without SUPERUSER or BYPASSRLS, and
      # migrate, as the owner, grants it what it needs.
      - name: Creates the serving role
        run: |
          docker run --rm --network host --env PGPASSWORD=ci-only-password \
            postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d \
            psql --host=127.0.0.1 --username=slotlock_ci --dbname=slotlock --no-psqlrc \
              -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE slotlock_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
      - name: Migrates, serves and reports healthy
        run: |
          docker run --detach --name slotlock --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --env DATABASE_URL=postgresql://slotlock_app:ci-app-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_MIGRATE_DATABASE_URL=postgresql://slotlock_ci:ci-only-password@127.0.0.1:5432/slotlock \
            --env SLOTLOCK_AUTH_TOKEN="$(openssl rand -hex 32)" \
            --env SLOTLOCK_CONFIRMATION_SECRET="$(openssl rand -hex 32)" \
            --env HOST=127.0.0.1 \
            slotlock:ci serve --migrate
          health=starting
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' slotlock)
            [ "$health" = healthy ] && break
            sleep 2
          done
          docker logs slotlock
          if [ "$health" != healthy ]; then
            echo "::error::the container is $health, not healthy"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          docker stop slotlock
          [ "$(docker inspect --format '{{.State.ExitCode}}' slotlock)" = 0 ]
