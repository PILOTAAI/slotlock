# Release: on a v* tag, verify the tag, run the suite against PostgreSQL, pack the npm artifact
# (dist/), STAGE it on npm, and create the GitHub release with the tarball and its checksum. Once the
# suite has passed it also calls image.yml, which pushes the server image to GHCR and then publishes
# server.json to the MCP Registry, each after a required reviewer approves its environment (ghcr,
# mcp-registry), and publishes the five language clients, each after a reviewer approves its
# registry's environment (docs/release/clients.md). tag-release.yml pushes the tag of a merged
# version; an admin can push one by hand.
# Nothing in this workflow can make a version public on npm.
#
# Staging uses npm trusted publishing: npm exchanges this job's GitHub OIDC token (id-token: write)
# for a short-lived credential, so no npm token exists anywhere. Provenance is attached. The staged
# version stays private until a maintainer approves it with two-factor authentication
# (GOVERNANCE.md, Releases), which an OIDC token cannot do; the run's summary gives the commands:
#   npm stage view <stage-id>
#   npm stage approve <stage-id>      (prompts for 2FA; also npmjs.com > Staged Packages)
#   npm stage reject <stage-id>       (discards it instead)
# A version already on npm is left alone, so a re-run after a later job failed changes nothing there.
#
# One-time setup: scripts/configure-github.sh creates the `npm` environment (deployment tags v*).
# npm accepts a trusted publisher only for a package that exists, and expires one that has not
# published within 2 days, so the first version comes from a maintainer's own npm session and the
# publisher is created at the second release: each time, the job's summary asks for
# scripts/bootstrap-release.sh <tag>, which does it and re-runs the failed jobs.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The suite runs on the Node.js the image ships (the Dockerfile's FROM lines).
  NODE_VERSION: '24.22.1'
  # Staging needs npm >= 11.15.0 (npm stage) on Node.js >= 22.14.0. Node.js 24.21.0 bundles npm
  # 11.19.0, whose engines.node is "^20.17.0 || >=22.9.0", so nothing is installed outside a
  # lockfile; the publish job checks the version before it uses it.
  STAGE_NODE_VERSION: '24.21.0'
  NPM_VERSION: '11.19.0'

jobs:
  build:
    name: Verify, test and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: slotlock_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slotlock_ci --dbname=slotlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against main, package.json, CHANGELOG.md and server.json
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No dependency cache in a release build: nothing restored from another run.
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - name: Test, build and verify the package
        run: npm test
        env:
          DATABASE_URL: postgresql://slotlock_ci:ci-only-password@localhost:5432/slotlock
      - name: Pack dist/
        id: pack
        run: |
          mkdir release
          tarball=$(cd dist && npm pack --ignore-scripts --pack-destination ../release --json | jq -r '.[0].filename')
          (cd release && sha256sum "$tarball" > SHA256SUMS)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          {
            echo '### npm artifact'
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage on npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # Trusted publishing and provenance: npm exchanges this job's OIDC token.
      id-token: write
    steps:
      # For scripts/dist-tag.sh, from the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.STAGE_NODE_VERSION }}
          package-manager-cache: false
      - name: Check npm is ${{ env.NPM_VERSION }}
        run: |
          if [ "$(npm --version)" != "$NPM_VERSION" ]; then
            echo "::error::npm $(npm --version) is not the expected $NPM_VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - name: Verify the tarball checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Stage the tarball (trusted publishing, provenance)
        working-directory: release
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          # bootstrap TITLE WHY: the one-time step a maintainer runs, then this job fails.
          bootstrap() {
            {
              echo "### $1"
              echo "$2 From a checkout of main, logged in to npm (with 2FA) and gh:"
              echo '```'
              echo "scripts/bootstrap-release.sh $GITHUB_REF_NAME"
              echo '```'
              echo "It does that step and re-runs this run's failed jobs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1: run scripts/bootstrap-release.sh $GITHUB_REF_NAME (see the summary)."
            exit 1
          }
          version=${GITHUB_REF_NAME#v}
          if [ -n "$(npm view "slotlock@$version" version 2>/dev/null)" ]; then
            echo "### slotlock@$version is already on npm: nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! npm view slotlock name >/dev/null 2>&1; then
            bootstrap "slotlock is not on npm yet" \
              "npm accepts a trusted publisher only for a package that exists, so the first version comes from a maintainer's own npm session."
          fi
          # The tag is fixed once staged. `latest` only moves forward: a prerelease goes to `next`,
          # and a release on an older line (0.2.1 after 0.3.0) to latest-0.2.
          current=$(npm view slotlock dist-tags.latest 2>/dev/null || true)
          dist_tag=$(../scripts/dist-tag.sh "$version" "$current")
          if ! npm stage publish "./$TARBALL" --provenance --access public --tag "$dist_tag" 2>&1 | tee stage.log; then
            # npm answers an OIDC token it cannot match to a trusted publisher with ENEEDAUTH.
            if grep -Eq 'ENEEDAUTH|E401' stage.log; then
              bootstrap "npm refused this job's credential" \
                "slotlock has no trusted publisher for release.yml yet (it is created at the release after the first), or the one it has expired unused."
            fi
            {
              echo "### npm refused the stage"
              echo "If this run was re-run after staging once, slotlock@$version is already staged: approve or reject that"
              echo "stage (npm stage list slotlock). Otherwise the log above says why."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # npm prints "+ slotlock@<version> (staged with id <stage-id>)".
          stage_id=$(sed -n 's/^+ .* (staged with id \([^)]*\))$/\1/p' stage.log)
          {
            echo "### Staged slotlock@$version on npm (dist-tag $dist_tag)"
            echo "Check it again on the day you approve it (CONTRIBUTING.md, Releases), then approve with"
            echo "two-factor authentication:"
            echo '```'
            echo "npm stage view ${stage_id:-<stage-id from npm stage list slotlock>}"
            echo "scripts/check-stage.sh ${stage_id:-<stage-id>}"
            echo "npm stage approve ${stage_id:-<stage-id>}"
            echo '```'
            echo "Rejecting it instead (npm stage reject) leaves the tag and the GitHub release this run creates; delete"
            echo "the release with gh release delete $GITHUB_REF_NAME."
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image
    # Only a tag whose suite passed publishes an image or a registry entry.
    needs: build
    permissions:
      contents: read
      # What image.yml's jobs ask for: a called workflow can only keep or narrow these.
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    uses: ./.github/workflows/image.yml

  # The five language clients, at the package's version (scripts/client-versions.sh), each published
  # only once the suite has passed and a maintainer has approved its environment
  # (scripts/configure-github.sh). PyPI, crates.io and NuGet trust this workflow and environment by
  # OIDC (trusted publishing), so no token is stored for them; Maven Central has none, so a user
  # token in the maven-central environment uploads a deployment that a maintainer then publishes in
  # the Central Portal; a Go module version is its tag. docs/release/clients.md has each registry's
  # one-time setup, and what to do when a first publish needs it.
  pypi:
    name: PyPI (slotlock)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing (docs.pypi.org/trusted-publishers): PyPI exchanges this job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the sdist and the wheel
        working-directory: clients/python
        run: |
          python -m pip install --require-hashes -r release-requirements.txt
          python -m build --no-isolation --outdir dist .
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: clients/python/dist
          # A re-run after a later job failed changes nothing on PyPI.
          skip-existing: true

  crates-io:
    name: crates.io (slotlock)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      # Trusted publishing: crates.io exchanges this job's OIDC token for a token the action revokes
      # when the job ends. crates.io takes it only for a crate that exists: the first version is
      # published by hand (docs/release/clients.md).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.94.0, as CI builds the client
        run: rustup toolchain install 1.94.0 --profile minimal
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        working-directory: clients/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent 'slotlock-release (https://github.com/PILOTAAI/slotlock)' \
            "https://crates.io/api/v1/crates/slotlock/${VERSION#v}")" = 200 ]; then
            echo "### slotlock ${VERSION#v} is already on crates.io: nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo +1.94.0 publish --locked

  nuget:
    name: NuGet (Slotlock.Client)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      # Trusted publishing (learn.microsoft.com/nuget/nuget-org/trusted-publishing): nuget.org
      # exchanges this job's OIDC token for an API key valid for an hour.
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        working-directory: clients/dotnet
        run: dotnet pack src/Slotlock --configuration Release --output nupkg
      # The nuget.org profile that owns the trusted publishing policy, a repository variable.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        working-directory: clients/dotnet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven-central:
    name: Maven Central (io.pylota:slotlock)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.5.1'
      - name: Build and sign the publication
        working-directory: clients/java
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: gradle publishMavenPublicationToBundleRepository --console=plain
      - name: Upload it as a deployment a maintainer publishes
        env:
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: scripts/central-bundle.sh clients/java/build/central-bundle "${VERSION#v}" >> "$GITHUB_STEP_SUMMARY"

  go-module:
    name: Go module (clients/go)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: go-module
    permissions:
      # Push the clients/go/v<version> tag with GITHUB_TOKEN; a tag it pushes starts no workflow.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept for the one tag push below; the only code this job runs is this repository's own
          # script, from the tagged commit.
          persist-credentials: true
      - name: Tag the module
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/tag-go-module.sh "${VERSION#v}" "$GITHUB_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache: false
      # The proxy fetches a version the first time it is asked for, and lists it from then on.
      - name: Ask the Go module proxy for it
        env:
          VERSION: ${{ github.ref_name }}
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/PILOTAAI/slotlock/clients/go@$VERSION"

  github-release:
    name: GitHub release
    needs: [build, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Create the release and attach the tarball.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - name: Verify the tarball checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The notes are this version's CHANGELOG.md section, up to the next version heading.
          awk -v heading="## $version - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "release/$TARBALL" release/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Slotlock $version" \
              --notes-file notes.md "${prerelease[@]}" "release/$TARBALL" release/SHA256SUMS
          fi
          echo "### GitHub release $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
