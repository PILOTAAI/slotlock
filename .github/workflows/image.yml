# Image: build the server image for linux/amd64 and linux/arm64, push it to
# ghcr.io/pilotaai/slotlock, and attest its build provenance (verify with
# `gh attestation verify oci://ghcr.io/pilotaai/slotlock:<version> --repo PILOTAAI/slotlock
# --signer-workflow PILOTAAI/slotlock/.github/workflows/image.yml`). Its second job runs
# mcp-registry.yml, which publishes server.json, once the image is pushed.
#
# release.yml calls it for a v* tag once its "Verify, test and pack" job has passed, so an image or a
# registry entry never goes out for a tag whose tests failed. The push waits in the `ghcr`
# environment, and the registry entry in `mcp-registry`, for a required reviewer
# (scripts/configure-github.sh). An attestation made in a reusable workflow is signed by that
# workflow (gh attestation verify), so the signer stays image.yml, and the source ref is the tag.
#
# One-time setup by the repository owner: after the first push, make the ghcr.io/pilotaai/slotlock
# package public (Package settings > Change visibility; GitHub has no API for it). New GHCR packages
# start private, and the MCP Registry only accepts images it can pull anonymously.
# scripts/bootstrap-release.sh <tag> checks it, waits while you change it, and re-runs the failed job.
name: Image

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  image:
    name: Build, push and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ghcr
    permissions:
      contents: read
      # Push to ghcr.io/pilotaai/slotlock.
      packages: write
      # actions/attest: sign with an OIDC-issued certificate, store the attestation, and record
      # where the image is stored (push-to-registry).
      attestations: write
      id-token: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/pilotaai/slotlock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against main, package.json, CHANGELOG.md and server.json
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether this release takes the latest tag
        id: channel
        run: echo "tag=$(scripts/dist-tag.sh "${GITHUB_REF_NAME#v}" --git-tags)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # The action tags every semver release latest by default; latest goes only to a release
          # above every other one (scripts/dist-tag.sh), never to a patch of an older line.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.tag == 'latest' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The Dockerfile sets the descriptive labels, including io.modelcontextprotocol.server.name.
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  registry:
    name: MCP Registry
    needs: image
    permissions:
      contents: read
      # mcp-publisher login github-oidc.
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
