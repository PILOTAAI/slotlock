# Preview deploys of the CMS's pull requests (RFC 0006, 4.5): when the Site workflow has built a pull
# request from a cms/ branch of this repository, which the admin console's CMS opens, this uploads
# that build to the preview Worker (site/wrangler.preview.jsonc) as https://pr-<number>-<SITE_PREVIEW_HOST>/.
#
# Why a workflow of its own: a pull_request job runs the workflow file as the pull request has it, so
# a job there holding a Cloudflare token would give that token to anyone who can push a cms/ branch
# and edit site.yml in it. A workflow_run job always runs this file as it is on main. It takes nothing
# from the pull request but the static files of its build, which it uploads with main's Wrangler and
# main's configuration and never runs; it reads which pull request, branch and repository the run was
# for from GitHub's event, never from the build.
#
# Every action is pinned to a full commit SHA, the same as site.yml's.
#
# Set up:
#   repository variable   SITE_PREVIEW_HOST      slotlock-site-preview.<subdomain>.workers.dev; no
#                                                previews until it is set (a job's `if` reads only
#                                                repository variables, not an environment's)
#   `site-preview` environment, limited to main (where a workflow_run job runs):
#     secrets             CLOUDFLARE_API_TOKEN   Account: Workers Scripts: Edit
#                         CLOUDFLARE_ACCOUNT_ID
name: Site preview

on:
  workflow_run:
    workflows: [Site]
    types: [completed]

permissions: {}

concurrency:
  group: site-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'cms/') &&
      vars.SITE_PREVIEW_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The build's artifact, and which pull request it was for.
      actions: read
      pull-requests: read
    environment:
      name: site-preview
      url: https://pr-${{ steps.pull.outputs.number }}-${{ vars.SITE_PREVIEW_HOST }}/
    defaults:
      run:
        working-directory: site
    steps:
      # The pull request whose head is the commit the run built, on this repository's own cms/ branch:
      # read from GitHub, by the event's values, which reach the shell only as environment variables.
      - name: Find the pull request
        id: pull
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then echo "::error::not this repository's branch"; exit 1; fi
          if ! printf '%s' "$HEAD_BRANCH" | grep -Eq '^cms/[a-z0-9]+(-[a-z0-9]+){0,15}$'; then
            echo "::error::not a CMS branch"; exit 1
          fi
          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::no head commit"; exit 1; fi
          number=$(gh api "repos/$REPOSITORY/pulls?state=open&head=${REPOSITORY%%/*}:$HEAD_BRANCH&per_page=10" \
            --jq '[.[] | select(.head.sha == env.HEAD_SHA and .head.repo.full_name == env.REPOSITORY)] | .[0].number // empty')
          if ! printf '%s' "$number" | grep -Eq '^[1-9][0-9]{0,9}$'; then
            echo "No open pull request has this head any more: nothing to preview."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      # Main's Wrangler and configuration, never the pull request's: this job holds a Cloudflare token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Wrangler from main's lockfile
        run: npm ci --no-audit --no-fund
      # The static files the Site run built, by that run's id: uploaded as assets, never executed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # A preview is never indexed: every page says noindex, and robots.txt turns crawlers away.
      - name: Keep the preview out of search engines
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Check the Cloudflare credentials
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/check-cloudflare-credentials.sh
      - name: Upload the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ steps.pull.outputs.number }}
        run: npx wrangler versions upload -c wrangler.preview.jsonc --preview-alias "$ALIAS" --message "A CMS pull request's preview"
