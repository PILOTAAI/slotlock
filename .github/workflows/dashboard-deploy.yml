# Deploys the hosted dashboard Worker (workers/dashboard, Slotlock Cloud's app.slotlock.pylota.io)
# once CI has passed on a push to main, from exactly the commit CI tested, and only while that commit
# is still main's newest (the newer commit's own CI run deploys it). A manual run deploys main's newest
# commit once CI has passed on it. scripts/deploy-dashboard.mjs checks the production configuration
# and the Worker's secrets, deploys, checks the live dashboard, and rolls back to the versions that
# were live when that check fails.
#
# Everything it needs is on the `dashboard` environment, which only main can use;
# scripts/configure-github.sh --dashboard-deploy <config> stores it once Cloudflare accepts the token:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  secrets: a token that can deploy Workers
#   SLOTLOCK_DASHBOARD_WRANGLER_CONFIG           variable: the production Wrangler configuration
#                                                (no secrets: those are the Worker's own)
# A Workers deploy token can replace the Worker and so read its session secret, which signs in as
# any tenant. So the token lives on that environment alone, no pull request's code ever runs with
# it (workflow_run runs main's copy of this file, and the deploy checks out a commit already on
# main), and the job only starts for a push to this repository's main, never for a pull request
# from a branch that happens to be called main.
#
# Every action is pinned to the commit SHA site.yml uses. Wrangler is pinned exactly in
# workers/dashboard/package-lock.json.
name: Dashboard deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  pick:
    name: Pick the commit to deploy
    if: >-
      github.repository == 'PILOTAAI/slotlock' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Deploy only main's newest commit, once CI passed on it
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        # refs/heads/main, never the bare name: a tag called main would answer to `main` (and to
        # workflow_run's head_branch) and must not pass for the branch.
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          sha=${TESTED:-$main}
          if [ "$sha" != "$main" ]; then
            echo "::notice title=Dashboard deploy::Skipped $sha: main has moved on to $main, whose own CI run deploys it."
            exit 0
          fi
          # A manual run deploys only a commit CI passed. While CI is still running on it, this run
          # stands aside (CI's own completion deploys it); a commit CI failed, or never ran on, fails.
          if [ -z "$TESTED" ]; then
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if ! jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              if jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
                echo "::notice title=Dashboard deploy::CI is still running on main's newest commit $sha. It deploys on its own once CI passes."
                exit 0
              fi
              echo "::error title=Dashboard deploy::CI has not passed on main's newest commit $sha, so it is not deployed."
              exit 1
            fi
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy the dashboard Worker
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: dashboard
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    steps:
      # Checked again here, before any secret is read: a re-run of an earlier run would otherwise
      # deploy the commit its pick job chose then, after main has moved on.
      - name: Check the commit is still main's newest
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PICKED: ${{ needs.pick.outputs.sha }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$PICKED" != "$main" ]; then
            echo "::notice title=Dashboard deploy::Skipped $PICKED: main has moved on to $main, whose own CI run deploys it."
            echo "deploy=false" >>"$GITHUB_OUTPUT"
          else
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: "22" # wrangler 4.152.0 needs >= 22.0.0
          package-manager-cache: false
      # The Worker bundles Slotlock's own sources and its runtime dependencies. None of those runs
      # an install script, so none may in the job that later holds the token.
      - name: Install Slotlock's dependencies
        if: steps.current.outputs.deploy == 'true'
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Install Wrangler from the lockfile
        if: steps.current.outputs.deploy == 'true'
        working-directory: workers/dashboard
        run: npm ci --no-audit --no-fund
      - name: Check the Cloudflare credentials
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/check-cloudflare-credentials.sh
      - name: Deploy, check the live dashboard, roll back if it fails
        if: steps.current.outputs.deploy == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOTLOCK_DASHBOARD_WRANGLER_CONFIG: ${{ vars.SLOTLOCK_DASHBOARD_WRANGLER_CONFIG }}
          SLOTLOCK_DEPLOY_SHA: ${{ needs.pick.outputs.sha }}
        run: node scripts/deploy-dashboard.mjs
