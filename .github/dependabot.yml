# Weekly version updates for every manifest in the repository: npm (the library, the site and the
# dashboard Worker), the five language clients (Cargo, Go modules, Gradle, NuGet, pip), GitHub Actions
# (pinned by commit SHA), the Dockerfile's base images and the Compose file's postgres image (pinned
# by digest). A cooldown keeps a release out until it has been public for a week; security updates
# are not delayed by it. src/__tests__/release-infrastructure.test.ts fails when a manifest is added
# without an entry here.
# Dependabot's commits carry no Signed-off-by line; scripts/check-dco.sh exempts GitHub bot authors.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]

  # The site has its own lockfile (Astro, Starlight, Wrangler).
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site:
        update-types: [minor, patch]

  # The dashboard Worker's lockfile holds Wrangler only.
  - package-ecosystem: npm
    directory: /workers/dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dashboard:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /clients/rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /clients/go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: /clients/java
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: nuget
    directories: [/clients/dotnet/src/Slotlock, /clients/dotnet/tests/Slotlock.Tests]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The build backend (hatchling) in pyproject.toml's build-system; the client has no runtime
  # dependencies.
  - package-ecosystem: pip
    directory: /clients/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The image ships the Node.js LTS the release suite and CI run on
      # (src/__tests__/release-infrastructure.test.ts). A new major changes the Dockerfile,
      # release.yml and the CI matrix together, once it is LTS: by hand, not by a bump here.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
